name: sp-planning-secretariat-portal

services:
  postgres:
    image: postgres:17
    container_name: sp-planning-postgres
    environment:
      POSTGRES_DB: sp_planning_secretariat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - sp_planning_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: sp-planning-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["tools"]

volumes:
  sp_planning_postgres_data:
