<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/branding/govlo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Southern Province Planning Secretariat Portal" />
    <title>SP Planning Secretariat Portal</title>

    <!-- Google Fonts: preconnect for DNS + TLS warm-up -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      2026 Premium Variable Font Stack
      ─────────────────────────────────────────────────────────────────────────
      Cinzel           – Classical Roman display; authoritative headings
      Playfair Display – Optical-size variable serif; editorial sub-headings
      Plus Jakarta Sans– Humanist geometric sans; primary body & UI
      Inter            – Neutral grotesque; data tables, labels, micro-copy
      DM Mono          – Monospaced; numeric data, code, statistics
      ─────────────────────────────────────────────────────────────────────────
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Playfair+Display:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <!-- Sinhala & Tamil script fonts — loaded async so they don't block FCP -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
